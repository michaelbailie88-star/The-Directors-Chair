<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Browse Premises — The Director's Chair</title>
<meta name="description" content="110 house premises across 11 genres. Browse, then submit your own cast for the one you want.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --void: #0A0908; --charcoal: #17140F; --charcoal-lift: #1F1B14;
    --line: rgba(242,237,227,0.09); --tungsten: #E8A33D; --tungsten-hot: #F4C468;
    --tally: #C4432E; --paper: #F2EDE3; --ash: #8A8378;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--void); color: var(--paper); font-family: 'Inter', sans-serif; line-height: 1.5; }
  h1, h2 { font-family: 'Fraunces', serif; font-weight: 500; letter-spacing: -0.01em; }
  a { color: inherit; text-decoration: none; }

  .wrap { max-width: 1040px; margin: 0 auto; padding: 0 24px; }
  nav { background: rgba(10,9,8,0.86); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 10; }
  nav .inner { max-width: 1040px; margin: 0 auto; padding: 0 24px; display: flex; align-items: center; justify-content: space-between; height: 64px; }
  .brand { font-family: 'Fraunces', serif; font-size: 1.1rem; font-weight: 500; }
  .brand .dot { color: var(--tungsten); }
  .back-link { color: var(--ash); font-size: 0.88rem; }
  .back-link:hover { color: var(--paper); }

  main { padding: 56px 0 100px; }
  h1 { font-size: clamp(1.9rem, 4vw, 2.6rem); margin-bottom: 12px; }
  .sub { color: var(--ash); font-size: 1rem; margin-bottom: 32px; max-width: 60ch; }

  .genre-tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 28px; }
  .genre-tab {
    background: transparent; border: 1px solid var(--line); color: var(--ash);
    padding: 7px 14px; border-radius: 100px; font-size: 0.82rem; font-weight: 600;
    cursor: pointer; font-family: inherit;
  }
  .genre-tab.active { background: var(--tungsten); border-color: var(--tungsten); color: var(--void); }
  .genre-tab:hover:not(.active) { border-color: var(--ash); color: var(--paper); }

  .preset-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  @media (max-width: 900px) { .preset-grid { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 600px) { .preset-grid { grid-template-columns: 1fr; } }

  .preset-card {
    border: 1px solid var(--line); background: var(--charcoal); border-radius: 6px;
    padding: 20px; display: flex; flex-direction: column; gap: 10px;
  }
  .preset-card:hover { border-color: var(--ash); }
  .preset-card .p-genre {
    font-family: 'JetBrains Mono', monospace; font-size: 0.65rem; color: var(--tally);
    letter-spacing: 0.05em; text-transform: uppercase;
  }
  .preset-card h3 { font-size: 1.05rem; }
  .preset-card p { color: var(--ash); font-size: 0.86rem; line-height: 1.5; flex: 1; }
  .preset-card .submit-btn {
    align-self: flex-start; margin-top: 4px;
    background: transparent; border: 1px solid var(--tungsten); color: var(--tungsten-hot);
    padding: 8px 14px; border-radius: 4px; font-size: 0.82rem; font-weight: 600;
    cursor: pointer; font-family: inherit;
  }
  .preset-card .submit-btn:hover { background: var(--tungsten); color: var(--void); }

  .count-line { color: var(--ash); font-size: 0.85rem; font-family: 'JetBrains Mono', monospace; margin-bottom: 20px; }
</style>
</head>
<body>

<nav>
  <div class="inner">
    <div class="brand">The Director<span class="dot">'</span>s Chair</div>
    <a class="back-link" href="index.html">&larr; Back</a>
  </div>
</nav>

<main>
  <div class="wrap">
    <h1>Browse Premises</h1>
    <p class="sub">110 house premises across 11 genres. Pick one, then build a cast for it — submitting characters for a preset is always free.</p>

    <div class="genre-tabs" id="genre-tabs"></div>
    <p class="count-line" id="count-line"></p>
    <div class="preset-grid" id="preset-grid"></div>
  </div>
</main>

<script src="data/presets.js"></script>
<script>
(function () {
  "use strict";

  const GENRES = ["All"].concat(Array.from(new Set(PRESETS.map(function (p) { return p.genre; }))));
  const genreTabsEl = document.getElementById("genre-tabs");
  const countLineEl = document.getElementById("count-line");
  let activeGenre = "All";

  GENRES.forEach(function (g) {
    const tab = document.createElement("button");
    tab.className = "genre-tab" + (g === "All" ? " active" : "");
    tab.textContent = g;
    tab.addEventListener("click", function () {
      activeGenre = g;
      Array.from(genreTabsEl.children).forEach(function (t) { t.classList.remove("active"); });
      tab.classList.add("active");
      renderGrid();
    });
    genreTabsEl.appendChild(tab);
  });

  function renderGrid() {
    const grid = document.getElementById("preset-grid");
    grid.textContent = "";
    const filtered = activeGenre === "All" ? PRESETS : PRESETS.filter(function (p) { return p.genre === activeGenre; });
    countLineEl.textContent = filtered.length + " premise" + (filtered.length === 1 ? "" : "s");

    filtered.forEach(function (preset) {
      const card = document.createElement("div");
      card.className = "preset-card";

      const genreEl = document.createElement("span");
      genreEl.className = "p-genre";
      genreEl.textContent = preset.genre;

      const titleEl = document.createElement("h3");
      titleEl.textContent = preset.title;

      const loglineEl = document.createElement("p");
      loglineEl.textContent = preset.logline;

      const btn = document.createElement("button");
      btn.className = "submit-btn";
      btn.textContent = "Submit This Story";
      btn.addEventListener("click", function () {
        const url = "call-sheet.html?preset=" + encodeURIComponent(preset.title) + "&genre=" + encodeURIComponent(preset.genre);
        window.location.href = url;
      });

      card.appendChild(genreEl);
      card.appendChild(titleEl);
      card.appendChild(loglineEl);
      card.appendChild(btn);
      grid.appendChild(card);
    });
  }

  renderGrid();
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — The Director's Chair</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --void: #0A0908; --charcoal: #17140F; --charcoal-lift: #1F1B14;
    --line: rgba(242,237,227,0.09); --tungsten: #E8A33D; --tungsten-hot: #F4C468;
    --tally: #C4432E; --paper: #F2EDE3; --ash: #8A8378;
    --ok: #4A9D6E;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--void); color: var(--paper); font-family: 'Inter', sans-serif; line-height: 1.5; min-height: 100vh; }
  h1, h2 { font-family: 'Fraunces', serif; font-weight: 500; }
  .mono { font-family: 'JetBrains Mono', monospace; }
  button { font-family: inherit; cursor: pointer; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 0 24px; }

  /* ---- Login ---- */
  #login-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .login-card { max-width: 380px; width: 100%; border: 1px solid var(--line); background: var(--charcoal); padding: 36px; border-radius: 6px; }
  .login-card h1 { font-size: 1.4rem; margin-bottom: 6px; }
  .login-card p { color: var(--ash); font-size: 0.88rem; margin-bottom: 22px; }
  .login-card input {
    width: 100%; background: var(--void); border: 1px solid var(--line); color: var(--paper);
    padding: 12px 14px; border-radius: 4px; font-size: 0.95rem; margin-bottom: 14px;
  }
  .login-card input:focus { outline: none; border-color: var(--tungsten); }
  .btn { padding: 11px 20px; border-radius: 4px; font-weight: 600; font-size: 0.9rem; border: none; width: 100%; }
  .btn-primary { background: var(--tungsten); color: var(--void); }
  .btn-primary:hover { background: var(--tungsten-hot); }
  .btn-primary:disabled { opacity: 0.5; }
  .login-err { color: var(--tally); font-size: 0.85rem; margin-top: 10px; display: none; }
  .login-err.show { display: block; }

  /* ---- Dashboard shell ---- */
  #dashboard { display: none; }
  #dashboard.show { display: block; }
  header.top { position: sticky; top: 0; z-index: 20; background: rgba(10,9,8,0.94); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
  header.top .wrap { display: flex; align-items: center; justify-content: space-between; height: 60px; }
  .brand { font-family: 'Fraunces', serif; font-size: 1.05rem; }
  .brand .dot { color: var(--tungsten); }
  .logout-btn { background: transparent; border: 1px solid var(--line); color: var(--ash); padding: 7px 14px; border-radius: 4px; font-size: 0.82rem; }
  .logout-btn:hover { color: var(--paper); border-color: var(--ash); }

  main { padding: 32px 0 100px; }

  .tabs-row { display: flex; gap: 10px; margin-bottom: 24px; }
  .main-tab {
    background: transparent; border: 1px solid var(--line); color: var(--ash);
    padding: 9px 18px; border-radius: 5px; font-size: 0.9rem; font-weight: 600;
  }
  .main-tab.active { background: var(--charcoal-lift); border-color: var(--tungsten); color: var(--paper); }

  .status-filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
  .status-chip {
    background: transparent; border: 1px solid var(--line); color: var(--ash);
    padding: 6px 13px; border-radius: 100px; font-size: 0.8rem; font-weight: 600;
  }
  .status-chip.active { background: var(--tungsten); border-color: var(--tungsten); color: var(--void); }
  .status-chip .count { opacity: 0.75; margin-left: 4px; }

  .panel { display: none; }
  .panel.active { display: block; }

  .empty-state { color: var(--ash); font-size: 0.92rem; padding: 40px 0; text-align: center; }

  /* ---- Submission card ---- */
  .sub-card, .app-card {
    border: 1px solid var(--line); background: var(--charcoal); border-radius: 6px;
    padding: 22px; margin-bottom: 16px;
  }
  .sub-card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 14px; flex-wrap: wrap; }
  .sub-writer { font-family: 'Fraunces', serif; font-size: 1.15rem; }
  .sub-writer-meta { color: var(--ash); font-size: 0.82rem; margin-top: 3px; }
  .badge-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .badge {
    font-family: 'JetBrains Mono', monospace; font-size: 0.68rem; letter-spacing: 0.04em; text-transform: uppercase;
    padding: 4px 9px; border-radius: 3px; border: 1px solid var(--line);
  }
  .badge-path-preset { color: var(--tungsten); border-color: var(--tungsten); }
  .badge-path-original { color: var(--tungsten-hot); border-color: var(--tungsten-hot); }
  .badge-status-pending_review { color: var(--ash); }
  .badge-status-second_look { color: var(--tally); border-color: var(--tally); }
  .badge-status-selected { color: var(--ok); border-color: var(--ok); }
  .badge-status-closed { color: var(--ash); opacity: 0.7; }
  .badge-unpaid { color: var(--tally); border-color: var(--tally); }

  .sub-premise { font-family: 'Fraunces', serif; font-style: italic; font-size: 1.02rem; margin-bottom: 14px; line-height: 1.5; }
  .sub-preset-tag { color: var(--tungsten-hot); font-family: 'JetBrains Mono', monospace; font-size: 0.72rem; margin-bottom: 6px; display: block; }

  .char-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
  .char-item { border-left: 2px solid var(--line); padding-left: 12px; }
  .char-item .cname { font-weight: 600; font-size: 0.92rem; }
  .char-item .cdesc { color: var(--ash); font-size: 0.85rem; margin-top: 2px; }

  .second-look-note { color: var(--tally); font-size: 0.8rem; margin-bottom: 14px; }

  .feedback-area {
    width: 100%; background: var(--void); border: 1px solid var(--line); color: var(--paper);
    padding: 10px 12px; border-radius: 4px; font-size: 0.87rem; min-height: 60px; margin-bottom: 12px; font-family: inherit;
  }
  .feedback-area:focus { outline: none; border-color: var(--tungsten); }

  .action-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .action-btn { padding: 9px 16px; border-radius: 4px; font-size: 0.85rem; font-weight: 600; border: 1px solid var(--line); background: transparent; color: var(--paper); }
  .action-btn.select { border-color: var(--ok); color: var(--ok); }
  .action-btn.select:hover { background: rgba(74,157,110,0.1); }
  .action-btn.not-selected { border-color: var(--tally); color: var(--tally); }
  .action-btn.not-selected:hover { background: rgba(196,67,46,0.1); }
  .action-btn.close { color: var(--ash); }
  .action-btn.close:hover { color: var(--paper); border-color: var(--ash); }
  .action-btn.delete { border-color: var(--tally); background: var(--tally); color: var(--paper); }
  .action-btn.delete:hover:not(:disabled) { background: #a3372a; }
  .action-btn.delete:disabled { border-color: var(--line); background: transparent; color: var(--ash); }
  .action-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* ---- Story Builder (confessional packets) ---- */
  .builder-section { margin-top: 18px; padding-top: 18px; border-top: 1px dashed var(--line); }
  .builder-header { font-family: 'Fraunces', serif; font-size: 0.95rem; color: var(--tungsten-hot); margin-bottom: 12px; }
  .footage-link { display: inline-block; color: var(--ash); font-size: 0.8rem; margin-bottom: 14px; }
  .footage-link:hover { color: var(--tungsten-hot); }
  .action-btn.generate { border-color: var(--tungsten); color: var(--tungsten-hot); margin-bottom: 14px; }
  .action-btn.generate:hover:not(:disabled) { background: rgba(232,163,61,0.1); }
  .packet-card { background: var(--charcoal-lift); border: 1px solid var(--line); border-radius: 6px; padding: 16px; margin-bottom: 14px; }
  .packet-name { font-weight: 600; font-size: 0.92rem; color: var(--paper); margin-bottom: 10px; }
  .packet-field-label { display: block; color: var(--ash); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; margin-top: 10px; }
  .packet-field {
    width: 100%; background: var(--void); border: 1px solid var(--line); color: var(--paper);
    padding: 9px 11px; border-radius: 4px; font-size: 0.85rem; font-family: inherit; min-height: 46px;
  }
  .packet-field:focus { outline: none; border-color: var(--tungsten); }
  .packet-email-row { display: flex; gap: 10px; align-items: center; margin-top: 14px; flex-wrap: wrap; }
  .packet-email-input {
    flex: 1; min-width: 200px; background: var(--void); border: 1px solid var(--line); color: var(--paper);
    padding: 9px 11px; border-radius: 4px; font-size: 0.85rem; font-family: inherit;
  }
  .packet-email-input:focus { outline: none; border-color: var(--tungsten); }
  .action-btn.send { border-color: var(--ok); color: var(--ok); white-space: nowrap; }
  .action-btn.send:hover:not(:disabled) { background: rgba(74,157,110,0.1); }
  .packet-sent-note { color: var(--ok); font-size: 0.78rem; margin-top: 8px; }

  /* ---- Casting applicant card ---- */
  .app-card-top { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 12px; margin-bottom: 12px; }
  .app-title { font-family: 'Fraunces', serif; font-size: 1.05rem; }
  .app-meta { color: var(--ash); font-size: 0.85rem; margin-top: 4px; }
  .handle-tags { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0 14px; }
  .handle-tag { font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; color: var(--tungsten-hot); border: 1px solid var(--line); padding: 3px 9px; border-radius: 100px; }
  .status-select {
    background: var(--void); border: 1px solid var(--line); color: var(--paper);
    padding: 8px 12px; border-radius: 4px; font-size: 0.85rem;
  }

  .section-header {
    font-family: 'JetBrains Mono', monospace; font-size: 0.78rem; text-transform: uppercase;
    letter-spacing: 0.05em; color: var(--ash); border-bottom: 1px solid var(--line);
    padding-bottom: 8px; margin: 28px 0 14px;
  }
  .section-header:first-child { margin-top: 0; }
  .badge-new { color: var(--void); background: var(--tungsten-hot); border-color: var(--tungsten-hot); font-weight: 700; }

  .loading-row { color: var(--ash); font-size: 0.85rem; text-align: center; padding: 30px; }
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-card">
    <h1>The Director's <span style="color:var(--tungsten)">Chair</span></h1>
    <p>Admin — enter the password to see everything.</p>
    <input type="password" id="password-input" placeholder="Password" autocomplete="current-password">
    <button class="btn btn-primary" id="login-btn">Enter</button>
    <div class="login-err" id="login-err">Incorrect password.</div>
  </div>
</div>

<div id="dashboard">
  <header class="top">
    <div class="wrap">
      <div class="brand">The Director<span class="dot">'</span>s Chair <span class="mono" style="color:var(--ash); font-size:0.75rem;">/ ADMIN</span></div>
      <button class="logout-btn" id="logout-btn">Log out</button>
    </div>
  </header>

  <main class="wrap">
    <div class="tabs-row">
      <button class="main-tab active" data-tab="submissions">Submissions</button>
      <button class="main-tab" data-tab="casting">Casting Applicants</button>
    </div>

    <!-- ===== SUBMISSIONS PANEL ===== -->
    <section class="panel active" id="panel-submissions">
      <div class="status-filters" id="sub-filters"></div>
      <div id="sub-list"><div class="loading-row">Loading submissions…</div></div>
    </section>

    <!-- ===== CASTING PANEL ===== -->
    <section class="panel" id="panel-casting">
      <div class="status-filters" id="app-filters"></div>
      <div id="app-list"><div class="loading-row">Loading applicants…</div></div>
    </section>
  </main>
</div>

<script>
(function () {
  "use strict";

  let adminToken = sessionStorage.getItem("dc_admin_token") || null;
  let subStatusFilter = "all";
  let appStatusFilter = "all";
  let allSubmissions = [];
  let allApplicants = [];

  // "New since last visit" — localStorage (not sessionStorage) so it
  // survives closing the browser entirely, matching what "have I already
  // seen this" actually means for a recurring admin check-in. Read the OLD
  // stamp first (that's the threshold for what counts as new THIS visit),
  // then immediately overwrite it — so nothing renders as new again until
  // the NEXT separate visit. On a genuinely first-ever visit, treat
  // nothing as new (an empty dashboard screaming "NEW" at every historical
  // row would defeat the point).
  let lastVisitTimestamp = null;
  (function initLastVisit() {
    const stored = localStorage.getItem("dc_admin_last_visit");
    lastVisitTimestamp = stored ? parseInt(stored, 10) : null;
    localStorage.setItem("dc_admin_last_visit", String(Date.now()));
  })();
  function isNewSinceLastVisit(createdAt) {
    if (!lastVisitTimestamp || !createdAt) return false;
    return new Date(createdAt).getTime() > lastVisitTimestamp;
  }

  const loginScreen = document.getElementById("login-screen");
  const dashboard = document.getElementById("dashboard");

  function showDashboard() {
    loginScreen.style.display = "none";
    dashboard.classList.add("show");
    loadSubmissions();
    loadApplicants();
  }

  if (adminToken) showDashboard();

  document.getElementById("login-btn").addEventListener("click", attemptLogin);
  document.getElementById("password-input").addEventListener("keydown", function (e) {
    if (e.key === "Enter") attemptLogin();
  });

  async function attemptLogin() {
    const pw = document.getElementById("password-input").value;
    const btn = document.getElementById("login-btn");
    const err = document.getElementById("login-err");
    btn.disabled = true;
    btn.textContent = "Checking…";
    err.classList.remove("show");
    try {
      const res = await fetch("/admin-login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password: pw })
      });
      if (!res.ok) throw new Error();
      adminToken = pw;
      sessionStorage.setItem("dc_admin_token", pw);
      showDashboard();
    } catch {
      err.classList.add("show");
      btn.disabled = false;
      btn.textContent = "Enter";
    }
  }

  document.getElementById("logout-btn").addEventListener("click", function () {
    sessionStorage.removeItem("dc_admin_token");
    adminToken = null;
    dashboard.classList.remove("show");
    loginScreen.style.display = "flex";
  });

  // ---------------- Tabs ----------------
  document.querySelectorAll(".main-tab").forEach(function (tab) {
    tab.addEventListener("click", function () {
      document.querySelectorAll(".main-tab").forEach(function (t) { t.classList.remove("active"); });
      tab.classList.add("active");
      const target = tab.dataset.tab;
      document.querySelectorAll(".panel").forEach(function (p) { p.classList.remove("active"); });
      document.getElementById("panel-" + target).classList.add("active");
    });
  });

  async function adminFetch(url, options) {
    options = options || {};
    options.headers = Object.assign({}, options.headers, {
      "Authorization": "Bearer " + adminToken,
      "Content-Type": "application/json"
    });
    const res = await fetch(url, options);
    if (res.status === 401) {
      sessionStorage.removeItem("dc_admin_token");
      adminToken = null;
      dashboard.classList.remove("show");
      loginScreen.style.display = "flex";
      throw new Error("Session expired.");
    }
    return res;
  }

  // ---------------- Submissions ----------------
  const SUB_STATUSES = [
    { key: "all", label: "All" },
    { key: "pending_review", label: "Pending Review" },
    { key: "second_look", label: "Second Look" },
    { key: "selected", label: "Selected" },
    { key: "closed", label: "Closed" }
  ];

  function renderSubFilters() {
    const el = document.getElementById("sub-filters");
    el.textContent = "";
    SUB_STATUSES.forEach(function (s) {
      const count = s.key === "all" ? allSubmissions.length : allSubmissions.filter(function (x) { return x.status === s.key; }).length;
      const chip = document.createElement("button");
      chip.className = "status-chip" + (subStatusFilter === s.key ? " active" : "");
      chip.innerHTML = ""; // build via textContent-safe nodes
      const label = document.createTextNode(s.label + " ");
      const countSpan = document.createElement("span");
      countSpan.className = "count";
      countSpan.textContent = "(" + count + ")";
      chip.appendChild(label);
      chip.appendChild(countSpan);
      chip.addEventListener("click", function () {
        subStatusFilter = s.key;
        renderSubFilters();
        renderSubList();
      });
      el.appendChild(chip);
    });
  }

  async function loadSubmissions() {
    try {
      const res = await adminFetch("/admin-list-submissions?status=all&includeUnpaid=1");
      const data = await res.json();
      allSubmissions = data.submissions || [];
      renderSubFilters();
      renderSubList();
    } catch (e) {
      document.getElementById("sub-list").innerHTML = "";
      const err = document.createElement("div");
      err.className = "empty-state";
      err.textContent = "Could not load submissions: " + e.message;
      document.getElementById("sub-list").appendChild(err);
    }
  }

  function daysLeft(expiresAt) {
    if (!expiresAt) return null;
    const ms = new Date(expiresAt).getTime() - Date.now();
    return Math.ceil(ms / (1000 * 60 * 60 * 24));
  }

  const SUB_GROUP_ORDER = ["pending_review", "second_look", "selected", "closed"];
  const SUB_GROUP_LABELS = {
    pending_review: "Pending Review",
    second_look: "Second Look",
    selected: "Selected",
    closed: "Closed"
  };

  // Second Look is sorted soonest-expiring-first — those are the ones that
  // silently vanish into "closed" if they get buried, so they need to
  // surface first. Every other group keeps the API's own newest-first
  // order; there's no equivalent urgency signal for them.
  function sortSubGroup(key, items) {
    if (key !== "second_look") return items;
    return items.slice().sort(function (a, b) {
      const aExp = a.second_look_expires ? new Date(a.second_look_expires).getTime() : Infinity;
      const bExp = b.second_look_expires ? new Date(b.second_look_expires).getTime() : Infinity;
      return aExp - bExp;
    });
  }

  function buildSubCard(sub) {
    const card = document.createElement("div");
    card.className = "sub-card";

    const top = document.createElement("div");
    top.className = "sub-card-top";

    const writerBlock = document.createElement("div");
    const writerName = document.createElement("div");
    writerName.className = "sub-writer";
    writerName.textContent = sub.writer_name;
    const writerMeta = document.createElement("div");
    writerMeta.className = "sub-writer-meta";
    writerMeta.textContent = sub.writer_email + (sub.writer_country ? " · " + sub.writer_country : "");
    writerBlock.appendChild(writerName);
    writerBlock.appendChild(writerMeta);

    const badgeRow = document.createElement("div");
    badgeRow.className = "badge-row";

    if (isNewSinceLastVisit(sub.created_at)) {
      const newBadge = document.createElement("span");
      newBadge.className = "badge badge-new";
      newBadge.textContent = "New";
      badgeRow.appendChild(newBadge);
    }

    const pathBadge = document.createElement("span");
    pathBadge.className = "badge badge-path-" + sub.path;
    pathBadge.textContent = sub.path === "original" ? "Path B — Original" : "Path A — Preset";
    badgeRow.appendChild(pathBadge);

    const statusBadge = document.createElement("span");
    statusBadge.className = "badge badge-status-" + sub.status;
    statusBadge.textContent = sub.status.replace("_", " ");
    badgeRow.appendChild(statusBadge);

    if (sub.path === "original" && !sub.paid) {
      const unpaidBadge = document.createElement("span");
      unpaidBadge.className = "badge badge-unpaid";
      unpaidBadge.textContent = "Unpaid — abandoned checkout";
      badgeRow.appendChild(unpaidBadge);
    }

    top.appendChild(writerBlock);
    top.appendChild(badgeRow);
    card.appendChild(top);

    if (sub.path === "preset") {
      const tag = document.createElement("span");
      tag.className = "sub-preset-tag";
      tag.textContent = (sub.preset_genre || "") + " — Preset: " + sub.preset_title;
      card.appendChild(tag);
    } else {
      const premise = document.createElement("p");
      premise.className = "sub-premise";
      premise.textContent = "\u201c" + sub.original_premise + "\u201d";
      card.appendChild(premise);
    }

    if (sub.status === "second_look" && sub.second_look_expires) {
      const dl = daysLeft(sub.second_look_expires);
      const note = document.createElement("div");
      note.className = "second-look-note";
      note.textContent = dl !== null && dl >= 0
        ? "Second Look — " + dl + " day" + (dl === 1 ? "" : "s") + " remaining before this closes automatically."
        : "Second Look window has passed — will close on the next daily sweep.";
      card.appendChild(note);
    }

    const charList = document.createElement("div");
    charList.className = "char-list";
    (sub.characters || []).forEach(function (c) {
      const item = document.createElement("div");
      item.className = "char-item";
      const name = document.createElement("div");
      name.className = "cname";
      name.textContent = c.name;
      const desc = document.createElement("div");
      desc.className = "cdesc";
      desc.textContent = c.description;
      item.appendChild(name);
      item.appendChild(desc);
      charList.appendChild(item);
    });
    card.appendChild(charList);

    const feedback = document.createElement("textarea");
    feedback.className = "feedback-area";
    feedback.placeholder = "Feedback for the writer (sent either way)…";
    feedback.value = sub.feedback_text || "";
    card.appendChild(feedback);

    const actions = document.createElement("div");
    actions.className = "action-row";

    const canAct = sub.status === "pending_review" || sub.status === "second_look";
    const selectBtn = document.createElement("button");
    selectBtn.className = "action-btn select";
    selectBtn.textContent = "Select";
    selectBtn.disabled = !canAct;
    selectBtn.addEventListener("click", function () { updateSubmission(sub.id, "select", feedback.value); });

    const notSelectedBtn = document.createElement("button");
    notSelectedBtn.className = "action-btn not-selected";
    notSelectedBtn.textContent = sub.status === "second_look" ? "Still Not Selected" : "Not Selected";
    notSelectedBtn.disabled = !canAct;
    notSelectedBtn.addEventListener("click", function () { updateSubmission(sub.id, "not_selected", feedback.value); });

    const closeBtn = document.createElement("button");
    closeBtn.className = "action-btn close";
    closeBtn.textContent = "Close";
    closeBtn.disabled = sub.status === "closed";
    closeBtn.addEventListener("click", function () { updateSubmission(sub.id, "close", feedback.value); });

    const deleteBtn = document.createElement("button");
    deleteBtn.className = "action-btn delete";
    deleteBtn.textContent = "Delete Permanently";
    deleteBtn.disabled = sub.status !== "closed";
    deleteBtn.title = sub.status === "closed"
      ? "Permanently removes this submission. Cannot be undone."
      : "Only closed submissions can be deleted.";
    deleteBtn.addEventListener("click", function () {
      const who = sub.path === "original" ? sub.original_premise : sub.preset_title;
      if (!confirm("Permanently delete this submission (\"" + who + "\")? This cannot be undone.")) return;
      deleteSubmission(sub.id);
    });

    actions.appendChild(selectBtn);
    actions.appendChild(notSelectedBtn);
    actions.appendChild(closeBtn);
    actions.appendChild(deleteBtn);
    card.appendChild(actions);

    if (sub.status === "selected") {
      const builder = document.createElement("div");
      builder.className = "builder-section";

      const bHeader = document.createElement("div");
      bHeader.className = "builder-header";
      bHeader.textContent = "Story Builder — Confessional Packets";
      builder.appendChild(bHeader);

      const footageLink = document.createElement("a");
      footageLink.className = "footage-link";
      footageLink.href = "https://docs.google.com/forms/d/1Ma-hzvVIJy8iXYnlaqOs10OSRiNhzWFTr961UrkLKJU/edit#responses";
      footageLink.target = "_blank";
      footageLink.rel = "noopener";
      footageLink.textContent = "View submitted footage responses \u2197";
      builder.appendChild(footageLink);

      const hasPackets = !!(sub.generated_packets && Array.isArray(sub.generated_packets.characters));

      const genBtn = document.createElement("button");
      genBtn.className = "action-btn generate";
      genBtn.textContent = hasPackets ? "Regenerate All" : "Generate Packets";
      genBtn.addEventListener("click", function () {
        if (hasPackets) {
          const sentCount = sub.generated_packets.characters.filter(function (c) { return !!c.sent_at; }).length;
          if (sentCount > 0) {
            const ok = confirm(
              sentCount + " of " + sub.generated_packets.characters.length +
              " packet(s) have already been sent. Regenerating creates new content for everyone — " +
              "already-sent emails won't be un-sent, but the text shown here will change. Continue?"
            );
            if (!ok) return;
          }
        }
        generatePackets(sub.id, genBtn);
      });
      builder.appendChild(genBtn);

      if (hasPackets) {
        sub.generated_packets.characters.forEach(function (pc) {
          builder.appendChild(buildPacketCard(sub.id, pc));
        });
      }

      card.appendChild(builder);
    }

    return card;
  }

  function buildPacketCard(subId, pc) {
    const pcard = document.createElement("div");
    pcard.className = "packet-card";

    const pname = document.createElement("div");
    pname.className = "packet-name";
    pname.textContent = pc.name;
    pcard.appendChild(pname);

    const voiceLabel = document.createElement("label");
    voiceLabel.className = "packet-field-label";
    voiceLabel.textContent = "Voice direction";
    const voiceInput = document.createElement("textarea");
    voiceInput.className = "packet-field";
    voiceInput.value = pc.voice_direction || "";
    pcard.appendChild(voiceLabel);
    pcard.appendChild(voiceInput);

    const beatsLabel = document.createElement("label");
    beatsLabel.className = "packet-field-label";
    beatsLabel.textContent = "Riff beats (one per line)";
    const beatsInput = document.createElement("textarea");
    beatsInput.className = "packet-field";
    beatsInput.style.minHeight = "80px";
    beatsInput.value = (pc.riff_beats || []).join("\n");
    pcard.appendChild(beatsLabel);
    pcard.appendChild(beatsInput);

    const linesLabel = document.createElement("label");
    linesLabel.className = "packet-field-label";
    linesLabel.textContent = "Sample lines (one per line)";
    const linesInput = document.createElement("textarea");
    linesInput.className = "packet-field";
    linesInput.style.minHeight = "70px";
    linesInput.value = (pc.sample_lines || []).join("\n");
    pcard.appendChild(linesLabel);
    pcard.appendChild(linesInput);

    const emailRow = document.createElement("div");
    emailRow.className = "packet-email-row";
    const emailInput = document.createElement("input");
    emailInput.type = "email";
    emailInput.className = "packet-email-input";
    emailInput.placeholder = "cast member's email";
    emailInput.value = pc.delivery_email || "";
    const sendBtn = document.createElement("button");
    sendBtn.className = "action-btn send";
    sendBtn.textContent = pc.sent_at ? "Re-send" : "Send Packet";
    sendBtn.addEventListener("click", function () {
      sendPacket(subId, pc.name, emailInput.value, voiceInput.value, beatsInput.value, linesInput.value, sendBtn);
    });
    emailRow.appendChild(emailInput);
    emailRow.appendChild(sendBtn);
    pcard.appendChild(emailRow);

    if (pc.sent_at) {
      const sentNote = document.createElement("div");
      sentNote.className = "packet-sent-note";
      const when = new Date(pc.sent_at).toLocaleString();
      sentNote.textContent = "Sent " + when + (pc.delivery_email ? " to " + pc.delivery_email : "");
      pcard.appendChild(sentNote);
    }

    return pcard;
  }

  async function generatePackets(id, btn) {
    const original = btn.textContent;
    btn.disabled = true;
    btn.textContent = "Generating…";
    try {
      const res = await adminFetch("/admin-generate-packets", {
        method: "POST",
        body: JSON.stringify({ submissionId: id })
      });
      if (!res.ok) {
        const data = await res.json().catch(function () { return {}; });
        throw new Error(data.error || ("Request failed (" + res.status + ")"));
      }
      await loadSubmissions();
    } catch (e) {
      alert("Could not generate packets: " + e.message);
      btn.disabled = false;
      btn.textContent = original;
    }
  }

  async function sendPacket(subId, characterName, email, voiceDirectionText, beatsText, linesText, btn) {
    const trimmedEmail = (email || "").trim();
    if (!trimmedEmail) { alert("Enter an email address for " + characterName + " first."); return; }
    const riffBeats = beatsText.split("\n").map(function (s) { return s.trim(); }).filter(Boolean);
    const sampleLines = linesText.split("\n").map(function (s) { return s.trim(); }).filter(Boolean);
    if (!voiceDirectionText.trim() || riffBeats.length === 0 || sampleLines.length === 0) {
      alert("Voice direction, riff beats, and sample lines can't be empty.");
      return;
    }
    if (!confirm("Send this packet to " + trimmedEmail + "?")) return;

    const original = btn.textContent;
    btn.disabled = true;
    btn.textContent = "Sending…";
    try {
      const res = await adminFetch("/admin-send-packet", {
        method: "POST",
        body: JSON.stringify({
          submissionId: subId,
          characterName: characterName,
          email: trimmedEmail,
          voiceDirection: voiceDirectionText.trim(),
          riffBeats: riffBeats,
          sampleLines: sampleLines
        })
      });
      if (!res.ok) {
        const data = await res.json().catch(function () { return {}; });
        throw new Error(data.error || ("Request failed (" + res.status + ")"));
      }
      await loadSubmissions();
    } catch (e) {
      alert("Could not send packet: " + e.message);
      btn.disabled = false;
      btn.textContent = original;
    }
  }

  function renderSubList() {
    const listEl = document.getElementById("sub-list");
    listEl.textContent = "";

    if (subStatusFilter === "all") {
      let anyRendered = false;
      SUB_GROUP_ORDER.forEach(function (key) {
        const group = allSubmissions.filter(function (s) { return s.status === key; });
        if (group.length === 0) return;
        anyRendered = true;
        const header = document.createElement("div");
        header.className = "section-header";
        header.textContent = SUB_GROUP_LABELS[key] + " (" + group.length + ")";
        listEl.appendChild(header);
        sortSubGroup(key, group).forEach(function (sub) {
          listEl.appendChild(buildSubCard(sub));
        });
      });
      if (!anyRendered) {
        const empty = document.createElement("div");
        empty.className = "empty-state";
        empty.textContent = "Nothing here.";
        listEl.appendChild(empty);
      }
      return;
    }

    // A specific status chip is active — one group, no section header since
    // the chip itself already says which status this is.
    const filtered = sortSubGroup(subStatusFilter, allSubmissions.filter(function (s) { return s.status === subStatusFilter; }));
    if (filtered.length === 0) {
      const empty = document.createElement("div");
      empty.className = "empty-state";
      empty.textContent = "Nothing here.";
      listEl.appendChild(empty);
      return;
    }
    filtered.forEach(function (sub) { listEl.appendChild(buildSubCard(sub)); });
  }

  async function updateSubmission(id, action, feedback) {
    try {
      await adminFetch("/admin-update-submission", {
        method: "POST",
        body: JSON.stringify({ submissionId: id, action: action, feedback: feedback || null })
      });
      await loadSubmissions();
    } catch (e) {
      alert("Could not update submission: " + e.message);
    }
  }

  async function deleteSubmission(id) {
    try {
      await adminFetch("/admin-delete-submission", {
        method: "POST",
        body: JSON.stringify({ submissionId: id })
      });
      await loadSubmissions();
    } catch (e) {
      alert("Could not delete submission: " + e.message);
    }
  }

  // ---------------- Casting Applicants ----------------
  const APP_STATUSES = [
    { key: "all", label: "All" },
    { key: "applied", label: "Applied" },
    { key: "shortlisted", label: "Shortlisted" },
    { key: "cast", label: "Cast" },
    { key: "passed", label: "Passed" }
  ];

  function renderAppFilters() {
    const el = document.getElementById("app-filters");
    el.textContent = "";
    APP_STATUSES.forEach(function (s) {
      const count = s.key === "all" ? allApplicants.length : allApplicants.filter(function (x) { return x.status === s.key; }).length;
      const chip = document.createElement("button");
      chip.className = "status-chip" + (appStatusFilter === s.key ? " active" : "");
      const label = document.createTextNode(s.label + " ");
      const countSpan = document.createElement("span");
      countSpan.className = "count";
      countSpan.textContent = "(" + count + ")";
      chip.appendChild(label);
      chip.appendChild(countSpan);
      chip.addEventListener("click", function () {
        appStatusFilter = s.key;
        renderAppFilters();
        renderAppList();
      });
      el.appendChild(chip);
    });
  }

  async function loadApplicants() {
    try {
      const res = await adminFetch("/admin-list-casting?status=all");
      const data = await res.json();
      allApplicants = data.applicants || [];
      renderAppFilters();
      renderAppList();
    } catch (e) {
      document.getElementById("app-list").innerHTML = "";
      const err = document.createElement("div");
      err.className = "empty-state";
      err.textContent = "Could not load applicants: " + e.message;
      document.getElementById("app-list").appendChild(err);
    }
  }

  const APP_GROUP_ORDER = ["applied", "shortlisted", "cast", "passed"];
  const APP_GROUP_LABELS = {
    applied: "Applied",
    shortlisted: "Shortlisted",
    cast: "Cast",
    passed: "Passed"
  };

  function buildAppCard(app) {
    const card = document.createElement("div");
    card.className = "app-card";

    const top = document.createElement("div");
    top.className = "app-card-top";

    const infoBlock = document.createElement("div");
    const titleRow = document.createElement("div");
    titleRow.style.display = "flex";
    titleRow.style.alignItems = "center";
    titleRow.style.gap = "8px";
    if (isNewSinceLastVisit(app.created_at)) {
      const newBadge = document.createElement("span");
      newBadge.className = "badge badge-new";
      newBadge.textContent = "New";
      titleRow.appendChild(newBadge);
    }
    const title = document.createElement("div");
    title.className = "app-title";
    title.textContent = app.city + ", " + app.country;
    titleRow.appendChild(title);
    const meta = document.createElement("div");
    meta.className = "app-meta";
    meta.textContent = app.age + " · " + app.gender + " · " + app.email;
    infoBlock.appendChild(titleRow);
    infoBlock.appendChild(meta);

    const select = document.createElement("select");
    select.className = "status-select";
    APP_STATUSES.filter(function (s) { return s.key !== "all"; }).forEach(function (s) {
      const opt = document.createElement("option");
      opt.value = s.key;
      opt.textContent = s.label;
      if (app.status === s.key) opt.selected = true;
      select.appendChild(opt);
    });
    select.addEventListener("change", function () {
      updateApplicant(app.id, select.value);
    });

    top.appendChild(infoBlock);
    top.appendChild(select);
    card.appendChild(top);

    const handles = document.createElement("div");
    handles.className = "handle-tags";
    (app.handles || []).forEach(function (h) {
      const tag = document.createElement("span");
      tag.className = "handle-tag";
      tag.textContent = h.platform + ": " + h.handle;
      handles.appendChild(tag);
    });
    card.appendChild(handles);

    return card;
  }

  function renderAppList() {
    const listEl = document.getElementById("app-list");
    listEl.textContent = "";

    if (appStatusFilter === "all") {
      let anyRendered = false;
      APP_GROUP_ORDER.forEach(function (key) {
        const group = allApplicants.filter(function (a) { return a.status === key; });
        if (group.length === 0) return;
        anyRendered = true;
        const header = document.createElement("div");
        header.className = "section-header";
        header.textContent = APP_GROUP_LABELS[key] + " (" + group.length + ")";
        listEl.appendChild(header);
        group.forEach(function (app) { listEl.appendChild(buildAppCard(app)); });
      });
      if (!anyRendered) {
        const empty = document.createElement("div");
        empty.className = "empty-state";
        empty.textContent = "Nothing here.";
        listEl.appendChild(empty);
      }
      return;
    }

    const filtered = allApplicants.filter(function (a) { return a.status === appStatusFilter; });
    if (filtered.length === 0) {
      const empty = document.createElement("div");
      empty.className = "empty-state";
      empty.textContent = "Nothing here.";
      listEl.appendChild(empty);
      return;
    }
    filtered.forEach(function (app) { listEl.appendChild(buildAppCard(app)); });
  }

  async function updateApplicant(id, status) {
    try {
      await adminFetch("/admin-update-casting", {
        method: "POST",
        body: JSON.stringify({ applicantId: id, status: status })
      });
      await loadApplicants();
    } catch (e) {
      alert("Could not update applicant: " + e.message);
    }
  }

})();
</script>
</body>
</html>

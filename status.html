<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Submission — The Director's Chair</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --void: #0A0908; --charcoal: #17140F; --charcoal-lift: #1F1B14;
    --line: rgba(242,237,227,0.09); --tungsten: #E8A33D; --tungsten-hot: #F4C468;
    --tally: #C4432E; --paper: #F2EDE3; --ash: #8A8378; --ok: #4A9D6E;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--void); color: var(--paper); font-family: 'Inter', sans-serif; line-height: 1.5; min-height: 100vh; }
  h1 { font-family: 'Fraunces', serif; font-weight: 500; letter-spacing: -0.01em; }
  a { color: inherit; text-decoration: none; }

  .wrap { max-width: 560px; margin: 0 auto; padding: 0 24px; }
  nav { background: rgba(10,9,8,0.86); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
  nav .inner { max-width: 1040px; margin: 0 auto; padding: 0 24px; display: flex; align-items: center; justify-content: space-between; height: 64px; }
  .brand { font-family: 'Fraunces', serif; font-size: 1.1rem; font-weight: 500; }
  .brand .dot { color: var(--tungsten); }
  .back-link { color: var(--ash); font-size: 0.88rem; }
  .back-link:hover { color: var(--paper); }

  main { padding: 64px 0 100px; }
  .state-loading, .state-error { color: var(--ash); font-size: 0.95rem; }
  .state-error { color: var(--tally); }

  .status-pill {
    display: inline-flex; align-items: center; gap: 8px;
    font-family: 'JetBrains Mono', monospace; font-size: 0.78rem;
    border: 1px solid var(--line); border-radius: 100px;
    padding: 7px 14px; margin-bottom: 24px; text-transform: uppercase; letter-spacing: 0.04em;
  }
  .status-pill .dot { width: 7px; height: 7px; border-radius: 50%; }
  .status-pending .dot { background: var(--ash); }
  .status-second_look .dot { background: var(--tally); box-shadow: 0 0 8px rgba(196,67,46,0.7); }
  .status-selected .dot { background: var(--ok); box-shadow: 0 0 8px rgba(74,157,110,0.7); }
  .status-closed .dot { background: var(--ash); }
  .status-pending { color: var(--paper); }
  .status-second_look { color: var(--tally); border-color: var(--tally); }
  .status-selected { color: var(--ok); border-color: var(--ok); }
  .status-closed { color: var(--ash); }

  h1 { font-size: clamp(1.7rem, 4vw, 2.2rem); margin-bottom: 16px; max-width: 20ch; }
  .status-explain { color: var(--ash); font-size: 0.98rem; line-height: 1.65; margin-bottom: 34px; }
  .status-explain strong { color: var(--paper); }

  .detail-card { border: 1px solid var(--line); background: var(--charcoal); border-radius: 6px; padding: 26px; margin-bottom: 20px; }
  .detail-card .label { font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; color: var(--tungsten); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; display: block; }
  .detail-card .premise { font-family: 'Fraunces', serif; font-style: italic; font-size: 1.1rem; line-height: 1.5; margin-bottom: 4px; }
  .char-row { border-left: 2px solid var(--line); padding-left: 12px; margin-top: 14px; }
  .char-row .cname { font-weight: 600; font-size: 0.9rem; }
  .char-row .cdesc { color: var(--ash); font-size: 0.85rem; margin-top: 2px; }

  .feedback-card { border: 1px solid var(--tungsten); background: var(--charcoal-lift); border-radius: 6px; padding: 22px; margin-bottom: 20px; }
  .feedback-card .label { color: var(--tungsten-hot); }
  .feedback-card p { font-size: 0.92rem; line-height: 1.6; }

  .fine { color: var(--ash); font-size: 0.82rem; margin-top: 28px; line-height: 1.6; }
</style>
</head>
<body>

<nav>
  <div class="inner">
    <div class="brand">The Director<span class="dot">'</span>s Chair</div>
    <a class="back-link" href="index.html">&larr; Back</a>
  </div>
</nav>

<main>
  <div class="wrap" id="content">
    <p class="state-loading">Checking your submission&hellip;</p>
  </div>
</main>

<script>
(function () {
  "use strict";
  const params = new URLSearchParams(window.location.search);
  const id = params.get("id");
  const content = document.getElementById("content");

  const STATUS_COPY = {
    pending_review: {
      pill: "Pending Review",
      class: "status-pending",
      explain: "Your submission is real, it's in the queue, and it hasn't been reviewed yet. You'll hear back either way — this page will update once it has."
    },
    second_look: {
      pill: "Second Look",
      class: "status-second_look",
      explain: "Not selected this round \u2014 but your submission automatically moved into a 30-day reconsideration window. No extra fee, no action needed on your end."
    },
    selected: {
      pill: "Selected",
      class: "status-selected",
      explain: "Your submission was selected. Casting will be announced separately \u2014 you're credited once the film is produced."
    },
    closed: {
      pill: "Closed",
      class: "status-closed",
      explain: "This entry's review period has ended without selection. Per the submission terms, this is final \u2014 no refund, credit, or renewal."
    }
  };

  function el(tag, props, children) {
    const e = document.createElement(tag);
    Object.assign(e, props || {});
    (children || []).forEach(function (c) { e.appendChild(c); });
    return e;
  }
  function text(t) { return document.createTextNode(t); }

  function daysLeft(expiresAt) {
    if (!expiresAt) return null;
    return Math.ceil((new Date(expiresAt).getTime() - Date.now()) / (1000 * 60 * 60 * 24));
  }

  function render(sub) {
    content.textContent = "";
    const cfg = STATUS_COPY[sub.status] || STATUS_COPY.pending_review;

    const pill = el("div", { className: "status-pill " + cfg.class }, [
      el("span", { className: "dot" }),
      text(cfg.pill)
    ]);
    content.appendChild(pill);

    content.appendChild(el("h1", { textContent: "Your Submission" }));

    let explain = cfg.explain;
    if (sub.status === "second_look" && sub.second_look_expires) {
      const d = daysLeft(sub.second_look_expires);
      if (d !== null && d >= 0) explain += " (" + d + " day" + (d === 1 ? "" : "s") + " left.)";
    }
    content.appendChild(el("p", { className: "status-explain", textContent: explain }));

    const card = el("div", { className: "detail-card" });
    card.appendChild(el("span", { className: "label", textContent: sub.path === "original" ? "Your Original Premise" : "Preset Chosen" }));
    card.appendChild(el("p", { className: "premise", textContent: sub.path === "original" ? sub.original_premise : sub.preset_title }));
    if (sub.path === "preset" && sub.preset_genre) {
      card.appendChild(el("p", { style: "color: var(--ash); font-size: 0.82rem; margin-top: 4px;", textContent: sub.preset_genre }));
    }
    (sub.characters || []).forEach(function (c) {
      const row = el("div", { className: "char-row" });
      row.appendChild(el("div", { className: "cname", textContent: c.name }));
      row.appendChild(el("div", { className: "cdesc", textContent: c.description }));
      card.appendChild(row);
    });
    content.appendChild(card);

    if (sub.path === "original") {
      const payCard = el("div", { className: "detail-card" });
      payCard.appendChild(el("span", { className: "label", textContent: "Payment" }));
      payCard.appendChild(el("p", {
        textContent: sub.paid ? "$10.00 \u2014 confirmed paid." : "Not yet paid \u2014 this submission is not in the review queue until checkout completes.",
        style: "color: " + (sub.paid ? "var(--ok)" : "var(--tally)") + "; font-size: 0.92rem;"
      }));
      content.appendChild(payCard);
    }

    if (sub.feedback_text) {
      const fb = el("div", { className: "feedback-card" });
      fb.appendChild(el("span", { className: "label", textContent: "Feedback" }));
      fb.appendChild(el("p", { textContent: sub.feedback_text }));
      content.appendChild(fb);
    }

    content.appendChild(el("p", {
      className: "fine",
      textContent: "Credit if selected: " + sub.credit_line + " You"
    }));
  }

  if (!id) {
    content.textContent = "";
    content.appendChild(el("p", { className: "state-error", textContent: "No submission ID given \u2014 use the link from your confirmation email." }));
    return;
  }

  fetch("/get-submission?id=" + encodeURIComponent(id))
    .then(function (res) {
      if (!res.ok) throw new Error("not found");
      return res.json();
    })
    .then(function (data) { render(data.submission); })
    .catch(function () {
      content.textContent = "";
      content.appendChild(el("p", { className: "state-error", textContent: "Couldn't find a submission with that link. If you think this is wrong, reply to your confirmation email." }));
    });
})();
</script>
</body>
</html>
